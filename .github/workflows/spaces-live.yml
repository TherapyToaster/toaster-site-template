name: Twitter Spaces live status

# Does nothing until BOTH of these are set:
#   - repository secret X_BEARER_TOKEN
#   - spaces.userId in site.config.json (digits only)
# API errors are logged. status.json is left unchanged, and the job still succeeds.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: spaces-live
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for a live Space
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node scripts/check-spaces.js

      - name: Commit status.json when it changes
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          if git diff --quiet -- status.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "status.json unchanged."
            exit 0
          fi
          git add status.json
          git commit -m "Update Twitter Spaces live status"
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checkout main after the commit above. The workflow SHA is the
      # scheduled revision, which does not include the status.json update.
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect site files
        run: sh scripts/collect-site.sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
